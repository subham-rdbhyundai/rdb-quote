<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDB Hyundai — Accessory Selector</title>
<style>
  :root{--hy:#002c5f;--hy2:#0a3f86;--acc:#00aad2;--line:#e2e6ea;--bg:#f4f6f8;--ok:#0a7d34;--vendor:#8a5a00;--ink:#111}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  header{background:var(--hy);color:#fff;padding:14px 16px}
  header h1{margin:0;font-size:17px}
  header p{margin:3px 0 0;font-size:12px;opacity:.85}
  .wrap{max-width:880px;margin:0 auto;padding:12px 12px 160px}
  .seg{display:flex;background:#e7ebef;border-radius:10px;padding:3px;margin:12px 0}
  .seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:13px;font-weight:bold;color:#4a5560;cursor:pointer}
  .seg button.on{background:#fff;color:var(--hy);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .controls{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .controls .full{grid-column:1/-1}
  label{font-size:12px;font-weight:bold;color:#333;display:block;margin-bottom:4px}
  select,input[type=text]{width:100%;padding:9px 10px;font-size:14px;border:1px solid #c7ccd1;border-radius:8px;background:#fff}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px}
  .bundles{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
  .bundle{flex:1 1 220px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
  .bundle:hover{border-color:var(--acc)}
  .bundle .bn{font-weight:bold;color:var(--hy);font-size:14px}
  .bundle .bd{font-size:12px;color:#666;margin-top:3px}
  .cat{margin:12px 0 0;font-size:13px;font-weight:bold;color:var(--hy);background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .cat:hover{border-color:var(--acc)}
  .cat .car{transition:transform .15s;font-size:11px;color:#8a93a0}
  .cat.open .car{transform:rotate(90deg)}
  .cat .cname{flex:1}
  .cat .csel{font-size:11px;font-weight:bold;color:#fff;background:var(--ok);border-radius:20px;padding:1px 7px}
  .cat-body{margin:6px 0 4px;padding-left:2px}
  #toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(20px);background:#0a7d34;color:#fff;font-size:13px;font-weight:bold;padding:10px 16px;border-radius:24px;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90%;text-align:center;z-index:30}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
  .item.sel{border-color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
  .it-main{flex:1;min-width:0}
  .it-name{font-size:14px;font-weight:600;line-height:1.25}
  .it-meta{font-size:11px;color:#777;margin-top:2px}
  .badge{display:inline-block;font-size:10px;font-weight:bold;padding:1px 6px;border-radius:20px;margin-left:6px;background:#fff3df;color:var(--vendor);border:1px solid #e6c98c}
  .it-price{font-size:14px;font-weight:bold;white-space:nowrap}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:30px;height:30px;border:1px solid #c7ccd1;background:#fff;border-radius:7px;font-size:17px;cursor:pointer;line-height:1}
  .qty span{min-width:18px;text-align:center;font-weight:bold;font-size:14px}
  .seeall{margin:14px 0;text-align:center}
  .seeall button{background:#fff;border:1px solid var(--hy);color:var(--hy);padding:9px 16px;border-radius:9px;font-size:13px;font-weight:bold;cursor:pointer}
  .empty{text-align:center;color:#888;padding:26px;font-size:13px}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.06)}
  .bar-in{max-width:880px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .bar .sum{flex:1;font-size:13px}
  .bar .sum b{font-size:20px;color:var(--hy)}
  .btn{background:var(--hy);color:#fff;border:0;padding:11px 16px;border-radius:9px;font-size:14px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.alt{background:#fff;color:var(--hy);border:1px solid var(--hy)}
  .result{background:#eafbef;border:1px solid #a9dfbb;border-radius:9px;padding:12px;margin-top:10px}
  .result .lnk{display:block;margin-top:8px;font-family:monospace;font-size:11px;word-break:break-all;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal.on{display:flex}
  .card{background:#fff;border-radius:12px;max-width:460px;width:100%;padding:16px;max-height:80vh;overflow:auto}
  .card h3{margin:0 0 8px;color:var(--hy);font-size:16px}
  .brow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .brow input{margin:0}
  .brow .bp{margin-left:auto;font-weight:bold}
</style>
</head>
<body>
<header>
  <h1>RDB Hyundai — Accessory Selector</h1>
  <p>Choose your car, then your accessories. All prices at MRP.</p>
</header>
<div class="wrap">
  <div class="seg">
    <button id="mCust" class="on" data-mode="cust">Customer view</button>
    <button id="mCons" data-mode="cons">Consultant (full)</button>
  </div>
  <div class="controls">
    <div><label for="model">Model</label><select id="model"></select></div>
    <div><label for="variant">Variant</label><select id="variant"></select></div>
    <div class="full" id="searchWrap" style="display:none"><label for="search">Search accessory</label><input type="text" id="search" placeholder="e.g. mat, dashcam, alloy"></div>
    <div class="full toggle" id="vendWrap" style="display:none"><input type="checkbox" id="vendorTog" checked><label for="vendorTog" style="margin:0">Include vendor / brand accessories</label></div>
  </div>
  <div id="bundles" class="bundles"></div>
  <div id="list"></div>
  <div class="seeall" id="seeallWrap"><button id="seeall">See all accessories +</button></div>
  <div id="result"></div>
</div>
<div class="bar">
  <div class="bar-in">
    <div class="sum"><span id="cnt">0 items</span><br><b id="total">Rs 0</b> <small>(MRP)</small></div>
    <button class="btn alt" id="clearBtn">Clear</button>
    <button class="btn" id="quoteBtn">Add to Quote &raquo;</button>
  </div>
</div>

"brand": "Thule", "appl": ""}]};
const FEATURED = ["Body Styling & Protection", "Basic Accy", "Seat Cover", "Seat Covers", "Garnish", "Comfort Accy", "Electrical"];
const BUNDLES = [{"name": "Protection Pack", "targets": [["mat"], ["mud", "guard", "flap"], ["body cover", "car cover"], ["door visor", "wind deflector"], ["sill", "scuff"]]}, {"name": "Styling Pack", "targets": [["chrome"], ["garnish"], ["spoiler"], ["alloy"], ["body kit", "cladding"]]}];
const sel = {};
let mode = 'cust', showAll = false, openCats = {};
const $ = id => document.getElementById(id);
const inr = n => 'Rs ' + Math.round(n).toLocaleString('en-IN');
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
const norm = s => (s||'').toLowerCase();

function initModels(){
  const m=$('model');
  CATALOG.models.forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;m.appendChild(o);});
  // preselect from launch hash (#car=..&var=..) if index links in with context
  const hm=/[#&]car=([^&]+)/.exec(location.hash||''); if(hm){const c=decodeURIComponent(hm[1]); if(CATALOG.models.includes(c)) m.value=c;}
  else m.value='Creta';
  initVariants();
}
function initVariants(){
  const model=$('model').value, v=$('variant'); v.innerHTML='';
  const list=CATALOG.variants[model]||['All'];
  ['All'].concat(list.filter(x=>x!=='All')).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;v.appendChild(o);});
  const hv=/[#&]var=([^&]+)/.exec(location.hash||''); if(hv){const vv=decodeURIComponent(hv[1]); if([].some.call(v.options,o=>o.value===vv)) v.value=vv;}
  render();
}
function visible(it){
  const model=$('model').value, variant=$('variant').value;
  if(!it.applies.includes(model)) return false;
  const isVendor = it.otype.indexOf('Vendor')>=0;
  if(mode==='cust' && isVendor) return false;                 // customers see genuine curated only
  if(mode==='cons' && isVendor && !$('vendorTog').checked) return false;
  if(variant!=='All' && it.variants!=='All' && it.variants!==''){
    const vs=it.variants.split(',').map(s=>s.trim());
    if(!vs.includes(variant)) return false;
  }
  if(mode==='cust' && !showAll && FEATURED.indexOf(it.cat)<0) return false;
  const q=norm(mode==='cons'?$('search').value:'').trim();
  if(q && norm(it.name+' '+it.cat+' '+it.sub+' '+(it.brand||'')).indexOf(q)<0) return false;
  if(it.mrp==null) return false;
  return true;
}
function keyOf(it){return it.pn||it.name;}
function findItem(k){return CATALOG.items.find(it=>keyOf(it)===k);}
function render(){
  // bundles only in customer mode
  $('bundles').style.display = mode==='cust' ? 'flex':'none';
  $('seeallWrap').style.display = mode==='cust' ? 'block':'none';
  $('searchWrap').style.display = mode==='cons' ? 'block':'none';
  $('vendWrap').style.display = mode==='cons' ? 'flex':'none';
  if(mode==='cust') renderBundles();
  const list=$('list'); list.innerHTML='';
  const items=CATALOG.items.filter(visible);
  if(!items.length){list.innerHTML='<div class="empty">No accessories match yet. Try See all, or the Consultant view for the complete catalogue.</div>';updateBar();return;}
  const cats={}; items.forEach(it=>{(cats[it.cat]=cats[it.cat]||[]).push(it);});
  const searching = mode==='cons' && $('search').value.trim()!=='';
  Object.keys(cats).sort().forEach(cat=>{
    const group=cats[cat];
    const open = searching || !!openCats[cat];
    const selCount = group.reduce((n,it)=>n+((sel[keyOf(it)]&&sel[keyOf(it)].qty>0)?1:0),0);
    const h=document.createElement('div');h.className='cat'+(open?' open':'');
    h.innerHTML='<span class="car">&#9654;</span><span class="cname">'+cat+' ('+group.length+')</span>'+
      (selCount?'<span class="csel">'+selCount+' selected</span>':'');
    h.onclick=()=>{openCats[cat]=!open;render();};
    list.appendChild(h);
    if(!open) return;
    const body=document.createElement('div');body.className='cat-body';
    group.forEach(it=>{
      const key=keyOf(it), cur=sel[key]?sel[key].qty:0;
      const d=document.createElement('div');d.className='item'+(cur>0?' sel':'');
      const vb=it.otype.indexOf('Vendor')>=0?'<span class="badge">'+(it.brand||'Vendor')+'</span>':'';
      d.innerHTML='<div class="it-main"><div class="it-name">'+it.name+vb+'</div><div class="it-meta">'+(it.pn||'')+(it.sub?' &middot; '+it.sub:'')+'</div></div>'+
        '<div class="it-price">'+inr(it.mrp)+'</div>'+
        '<div class="qty"><button data-k="'+key+'" data-d="-1">&minus;</button><span id="q_'+cssId(key)+'">'+cur+'</span><button data-k="'+key+'" data-d="1">+</button></div>';
      body.appendChild(d);
    });
    list.appendChild(body);
  });
  list.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>changeQty(b.getAttribute('data-k'),+b.getAttribute('data-d')));
  updateBar();
}
function cssId(k){return k.replace(/[^a-zA-Z0-9]/g,'_');}
function changeQty(key,delta){
  const it=findItem(key); if(!it)return;
  let q=(sel[key]?sel[key].qty:0)+delta; if(q<0)q=0;
  if(q===0) delete sel[key]; else sel[key]={item:it,qty:q};
  render();
}
function updateBar(){
  let t=0,c=0; Object.values(sel).forEach(s=>{t+=s.item.mrp*s.qty;c+=s.qty;});
  $('total').textContent=inr(t); $('cnt').textContent=c+(c===1?' item':' items');
}
/* ---- bundles: assemble one best-match item per target, confirm, then add ---- */
function renderBundles(){
  const host=$('bundles'); host.innerHTML='';
  BUNDLES.forEach((b,i)=>{
    const picks=assembleBundle(b);
    if(!picks.length) return;
    const total=picks.reduce((s,p)=>s+p.mrp,0);
    const d=document.createElement('div');d.className='bundle';
    d.innerHTML='<div class="bn">'+b.name+'</div><div class="bd">'+picks.length+' items &middot; '+inr(total)+' &middot; tap to add</div>';
    d.onclick=()=>addBundle(b,picks); host.appendChild(d);
  });
}
function addBundle(b,picks){
  if(!picks||!picks.length){toast('Nothing to add for this car');return;}
  picks.forEach(p=>{const k=keyOf(p);sel[k]={item:p,qty:(sel[k]?sel[k].qty:0)+1};});
  render();
  toast(b.name+' added ('+picks.length+' items). Adjust below if needed.');
}
function assembleBundle(b){
  const model=$('model').value, variant=$('variant').value, out=[], used={};
  b.targets.forEach(kws=>{
    const hit=CATALOG.items.find(it=>{
      if(!it.applies.includes(model)||it.mrp==null||used[keyOf(it)]) return false;
      if(it.otype.indexOf('Vendor')>=0) return false;
      if(variant!=='All'&&it.variants!=='All'&&it.variants!==''){if(!it.variants.split(',').map(s=>s.trim()).includes(variant))return false;}
      return kws.some(k=>norm(it.name).indexOf(k)>=0);
    });
    if(hit){used[keyOf(hit)]=1;out.push(hit);}
  });
  return out;
}
let _toastT=null;
function toast(msg){
  let t=$('toast');
  if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=msg;t.className='show';
  clearTimeout(_toastT);_toastT=setTimeout(()=>{t.className='';},2200);
}
/* ---- handoff to the quote ---- */
function buildLines(){
  const model=$('model').value;
  return Object.values(sel).map(s=>({
    name: s.item.name + (s.qty>1?' x'+s.qty:'') + ' ('+model+')',
    amt: Math.round(s.item.mrp*s.qty)
  }));
}
function addToQuote(){
  const lines=buildLines();
  if(!lines.length){alert('Select at least one accessory first.');return;}
  // merge with any pending handoff so adding in two batches never loses the first
  try{
    var prev=[];try{prev=JSON.parse(localStorage.getItem('rdb_acc_handoff')||'[]');}catch(_){prev=[];}
    if(!Array.isArray(prev))prev=[];
    localStorage.setItem('rdb_acc_handoff', JSON.stringify(prev.concat(lines)));
  }catch(e){}
  const fromQuote = /[#&]from=quote/.test(location.hash||'');
  const total=lines.reduce((t,l)=>t+l.amt,0);
  if(fromQuote){
    $('result').innerHTML='<div class="result"><b>'+lines.length+' accessory line(s), '+inr(total)+' (MRP)</b> added to your quote.'+
      '<div style="margin-top:6px">Pick more if you like, then go back to your quote tab to see them.</div>'+
      '<button class="btn" style="margin-top:10px" id="backBtn">&laquo; Back to my quote</button></div>';
    var bb=$('backBtn');if(bb)bb.onclick=function(){try{if(window.opener&&!window.opener.closed){window.opener.focus();window.close();return;}}catch(e){}
      alert('Switch back to your quote tab — the accessories are already added.');};
  } else {
    const url='index.html#acc='+b64u(JSON.stringify(lines));
    $('result').innerHTML='<div class="result"><b>'+lines.length+' accessory line(s), '+inr(total)+' (MRP)</b> ready.'+
      '<a class="btn" style="margin-top:10px" href="'+url+'">Open the quote with these accessories &raquo;</a></div>';
  }
  if($('result').scrollIntoView)$('result').scrollIntoView({behavior:'smooth',block:'center'});
}
function clearAll(){for(const k in sel)delete sel[k];$('result').innerHTML='';render();}
function setMode(m){mode=m;showAll=false;$('mCust').classList.toggle('on',m==='cust');$('mCons').classList.toggle('on',m==='cons');render();}
function boot(){
  initModels();
  $('model').onchange=initVariants; $('variant').onchange=render;
  $('search').oninput=render; $('vendorTog').onchange=render;
  $('mCust').onclick=()=>setMode('cust'); $('mCons').onclick=()=>setMode('cons');
  $('seeall').onclick=()=>{showAll=!showAll;$('seeall').textContent=showAll?'Show featured only':'See all accessories +';render();};
  $('quoteBtn').onclick=addToQuote; $('clearBtn').onclick=clearAll;
}
if(typeof document!=='undefined' && document.getElementById('model')) boot();
if(typeof module!=='undefined') module.exports={CATALOG,FEATURED,BUNDLES,buildLines,b64u};
</script>
